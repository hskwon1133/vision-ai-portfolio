services:
  postgres:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  fastapi:
    build: ./ai-server
    image: vision-ai-server
    ports:
      - "127.0.0.1:8001:8001"

  django:
    build: ./backend
    image: vision-backend
    env_file: .env
    environment: &backend_env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      FASTAPI_URL: http://fastapi:8001
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    image: vision-backend
    command: celery -A config worker -l info
    env_file: .env
    environment: *backend_env
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      fastapi:
        condition: service_started

volumes:
  pgdata:
  media:
