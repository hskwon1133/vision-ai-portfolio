{% extends "base.html" %}
{% block title %}로그인 · Vision Action{% endblock %}

{% block content %}
<section class="card auth-card">
  <h1>로그인</h1>
  <p class="sub">분석을 요청하려면 로그인하세요.</p>
  <form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary btn-block">로그인</button>
  </form>
  <p class="auth-switch">계정이 없나요? <a href="{% url 'signup' %}">회원가입</a></p>
</section>
{% endblock %}
