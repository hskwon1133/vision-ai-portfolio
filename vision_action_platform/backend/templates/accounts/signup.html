{% extends "base.html" %}
{% block title %}회원가입 · Vision Action{% endblock %}

{% block content %}
<section class="card auth-card">
  <h1>회원가입</h1>
  <p class="sub">아이디와 비밀번호만 있으면 바로 시작할 수 있어요.</p>
  <form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary btn-block">가입하기</button>
  </form>
  <p class="auth-switch">이미 계정이 있나요? <a href="{% url 'login' %}">로그인</a></p>
</section>
{% endblock %}
