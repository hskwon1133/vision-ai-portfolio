<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Vision Action{% endblock %}</title>
</head>
<body>
  <nav>
    <a href="{% url 'home' %}">홈</a>
    {% if user.is_authenticated %}
      | {{ user.username }}님
      {% if user.is_staff %} | <a href="{% url 'dashboard' %}">대시보드</a> | <a href="/admin/">관리자</a>{% endif %}
      <form action="{% url 'logout' %}" method="post" style="display:inline">
        {% csrf_token %}
        <button type="submit">로그아웃</button>
      </form>
    {% else %}
      | <a href="{% url 'login' %}">로그인</a>
      | <a href="{% url 'signup' %}">회원가입</a>
    {% endif %}
  </nav>
  <hr>
  {% block content %}{% endblock %}
</body>
</html>
